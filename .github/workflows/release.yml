name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish immutable release
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/virtizai
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Validate tag and source version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          code_version="$(python -c 'from virtizai_core.version import __version__; print(__version__)')"
          test "$tag_version" = "$code_version"
          channel=stable
          case "$tag_version" in
            *-*) channel=beta ;;
          esac
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME,,}:$tag_version" >> "$GITHUB_OUTPUT"

      - name: Run complete test suite
        run: make test

      - name: Build application and frontend assets
        run: make build

      - name: Build native package
        run: make package

      - name: Verify native package version
        shell: bash
        run: |
          set -euo pipefail
          deb="dist/virtizai_${{ steps.version.outputs.version }}_amd64.deb"
          test "$(dpkg-deb -f "$deb" Version)" = "${{ steps.version.outputs.version }}"
          test "$(dpkg-deb -f "$deb" Package)" = virtizai

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish canonical GHCR image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.image }}
          build-args: |
            VIRTIZAI_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          provenance: false
          sbom: false

      - name: Attest canonical container image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/virtizai
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Generate release manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          deb="dist/virtizai_${{ steps.version.outputs.version }}_amd64.deb"
          python packaging/generate-release-manifest.py \
            --version "${{ steps.version.outputs.version }}" \
            --channel "${{ steps.version.outputs.channel }}" \
            --release-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
            --deb "$deb" \
            --output dist/release-manifest.json \
            --target-schema "$(python -c 'from virtizai_core.migrations import MIGRATIONS; print(MIGRATIONS[-1][0])')" \
            --minimum-upgrade-version "$(python -c 'from virtizai_core.version import MIN_MANAGED_ROLLBACK_VERSION; print(MIN_MANAGED_ROLLBACK_VERSION)')" \
            --minimum-managed-rollback-version "$(python -c 'from virtizai_core.version import MIN_MANAGED_ROLLBACK_VERSION; print(MIN_MANAGED_ROLLBACK_VERSION)')" \
            --rollback-baseline "$(python -c 'from virtizai_core.version import MIN_MANAGED_ROLLBACK_VERSION; print(MIN_MANAGED_ROLLBACK_VERSION)')" \
            --rollback-requires-data-restore \
            --source-commit "${GITHUB_SHA}" \
            --container-image "${{ steps.version.outputs.image }}" \
            --container-digest "${{ steps.image.outputs.digest }}" \
            --provenance github-actions
          sha256sum "$deb" dist/release-manifest.json > dist/SHA256SUMS
          python -m json.tool dist/release-manifest.json >/dev/null
          grep -q "\"commit\": \"${GITHUB_SHA}\"" dist/release-manifest.json

      - name: Attest native package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/virtizai_${{ steps.version.outputs.version }}_amd64.deb

      - name: Attest release manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release-manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--title "VirtizAI ${{ steps.version.outputs.version }}" --generate-notes)
          if [ "${{ steps.version.outputs.channel }}" != stable ]; then args+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" \
            "dist/virtizai_${{ steps.version.outputs.version }}_amd64.deb" \
            dist/release-manifest.json \
            dist/SHA256SUMS
