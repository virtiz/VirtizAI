name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    name: Test, build, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=.github/workflows/pytest.log::${line}"
            done < <(tail -40 pytest.log)
            exit "$rc"
          fi


      - name: Compile application and frontend assets
        run: python -m compileall -q virtizai_core tests webui benchmarks virtizai_cli.py

      - name: Build native package
        run: sh packaging/build-deb.sh

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from virtizai_core.version import __version__; print(__version__)')"
          deb="dist/virtizai_${version}_amd64.deb"
          dpkg-deb -f "$deb" Package Version
          test "$(dpkg-deb -f "$deb" Version)" = "$version"

  container:
    name: Build container (no publish)
    runs-on: ubuntu-latest
    needs: test-build
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VIRTIZAI_VERSION=ci-${{ github.sha }}
          tags: virtizai:ci-${{ github.sha }}
